_schema-version: 3.3.0
ID: project1
version: 0.0.1
description: "An SAP Fiori application."

parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:

  # =========================================================
  # CAP SERVICE
  # =========================================================
  - name: project1-srv
    type: nodejs
    path: gen/srv

    parameters:
      instances: 1
      buildpack: nodejs_buildpack

    build-parameters:
      builder: npm-ci

    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

    requires:
      - name: project1-destination
      - name: project1-auth
      - name: project1-db


  # =========================================================
  # APP ROUTER
  # =========================================================
  - name: project1
    type: approuter.nodejs
    path: app/router

    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M

    requires:

      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

      - name: project1-auth

      - name: project1-destination

      - name: project1-html5-runtime

    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}


  # =========================================================
  # HTML5 APP DEPLOYER
  # =========================================================
  - name: project1-app-deployer
    type: com.sap.application.content
    path: gen

    build-parameters:
      build-result: app/

      requires:
        - name: project1project1
          artifacts:
            - project1.zip
          target-path: app/

    requires:

      - name: project1-auth

      - name: srv-api

      - name: project1-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true


  # =========================================================
  # FIORI / UI5 APPLICATION
  # =========================================================
  - name: project1project1
    type: html5
    path: app/project1

    build-parameters:
      build-result: dist
      builder: custom

      commands:
        - npm ci
        - npm run build

      supported-platforms: []


  # =========================================================
  # HANA DB DEPLOYER
  # =========================================================
  - name: project1-db-deployer
    type: hdb
    path: gen/db

    parameters:
      buildpack: nodejs_buildpack

    requires:
      - name: project1-db


# ===========================================================
# RESOURCES
# ===========================================================
resources:

  # =========================================================
  # DESTINATION SERVICE
  # =========================================================
  - name: project1-destination
    type: org.cloudfoundry.managed-service

    parameters:
      service: destination
      service-plan: lite


  # =========================================================
  # XSUAA
  # =========================================================
  - name: project1-auth
    type: org.cloudfoundry.managed-service

    parameters:
      service: xsuaa
      service-plan: application

      path: ./xs-security.json

      config:

        xsappname: project1-${org}-${space}

        tenant-mode: dedicated

        oauth2-configuration:

          credential-types:
            - "binding-secret"
            - "x509"

          redirect-uris:
            - https://*~{app-api/app-uri}/**
            - https://oauth.pstmn.io/v1/callback

        role-collections:

          - name: 'ZNW_ORD_DISPLAY (project1 ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.ZNW_ORD_DISPLAY'

          - name: 'ZNW_ORD_COORD (project1 ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.ZNW_ORD_COORD'

          - name: 'ZNW_ORD_ANALYST (project1 ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.ZNW_ORD_ANALYST'

    requires:
      - name: app-api


  # =========================================================
  # HTML5 REPOSITORY HOST
  # =========================================================
  - name: project1-html5-repo-host
    type: org.cloudfoundry.managed-service

    parameters:
      service: html5-apps-repo
      service-plan: app-host


  # =========================================================
  # HTML5 REPOSITORY RUNTIME
  # =========================================================
  - name: project1-html5-runtime
    type: org.cloudfoundry.managed-service

    parameters:
      service: html5-apps-repo
      service-plan: app-runtime


  # =========================================================
  # HANA HDI CONTAINER
  # =========================================================
  - name: project1-db
    type: com.sap.xs.hdi-container

    parameters:
      service: hana
      service-plan: hdi-shared